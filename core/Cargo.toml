[package]
name = "areyoughost_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core game engine for Are You Ghost? - A multiplayer social deduction game"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# Async runtime with networking support
tokio = { workspace = true, features = ["net", "time", "sync", "test-util"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bytes = "1.5"

# Database (PostgreSQL)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid"] }
dotenvy = "0.15"

# HTTP client for backend API communication
reqwest = { version = "0.11", features = ["json"] }

# WebSocket client (for connecting to server)
tokio-tungstenite = "0.21"

# FFI bridge for Flutter integration
flutter_rust_bridge = "=2.11.1"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
urlencoding = "2.1.3"
rand = "0.8"
